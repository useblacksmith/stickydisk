name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build-action:
    name: Build Action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0

      - name: Configure Buf Registry
        run: |
          npm config set @buf:registry https://buf.build/gen/npm/v1/
          npm config set //buf.build/gen/npm/v1/:_authToken ${{ secrets.BUF_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Check Prettier Formatting
        run: |
          npm run format
          # Check if prettier generated any changes
          if ! git diff --quiet; then
            echo "Error: Code is not formatted with prettier. Please run 'npm run format' locally and commit the changes."
            git status
            git diff
            exit 1
          fi

      - name: Check Lint
        run: npm run lint

      - name: Build Action
        id: build
        run: |
          npm run build
          # Check if any files were changed during build
          if ! git diff --quiet; then
            echo "Error: Build generated changes that aren't committed. Please run 'npm run build' locally and commit the changes,"
            echo "or download the 'dist' artifact from this run (gh run download ${{ github.run_id }} -n dist -D dist) and commit it."
            git diff
            exit 1
          fi

      # Building needs BUF_TOKEN for the private @buf packages, which contributors
      # without registry access (and automated fixers) do not have. Publish the
      # bundle CI just built so it can be committed without a local build.
      - name: Upload built dist
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
